<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#08090b" />
		<title>For You❤️</title>
		<link rel="stylesheet" href="style.css" />
		<script src="script.js" defer></script>
	</head>
	<body>
		<main class="scene" aria-label="A photograph forming from particles">
			<img id="photograph" src="assets/us_clean.jpg" alt="" aria-hidden="true" />
			<canvas id="particle-canvas" aria-hidden="true"></canvas>
			<section id="poetry" class="poetry" aria-label="Shayari" aria-hidden="true">
				<p class="letter-greeting">For you,</p>
				<div id="poetry-content"></div>
				<div class="letter-closing">
					<span class="letter-signoff">Yours truly,</span>
					<span class="letter-name">Swapnil</span>
				</div>
			</section>
			<div class="vignette" aria-hidden="true"></div>
			<div class="grain" aria-hidden="true"></div>
		</main>
	</body>
</html>
